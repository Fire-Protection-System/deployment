version: '3.8'

volumes:
  mongo-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  sonar-data: {}
  sonar-extensions: {}
  sonar-logs: {}
  sonar-postgres: {}

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    restart: always
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MONGO_INITDB_DATABASE: configurations
    network_mode: host

  rabbitmq-service:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    env_file:
      - ./environments/common.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    restart: unless-stopped
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  forest-simulator-service:
    build:
      context: fire-simulation
      dockerfile: Dockerfile
      network: host
    container_name: fire-simulation
    env_file:
      - ./environments/common.env
      - ./environments/fire-simulation.env
    ports:
      - "${SIMULATOR_PORT:-5000}:5000"
    depends_on:
      - rabbitmq-service
    restart: unless-stopped
    network_mode: host

  fire-backend-service:
    build:
      context: fire-backend
      dockerfile: Dockerfile
      cache_from:
        - fire-backend:latest
      network: host
    container_name: fire-backend
    image: fire-backend:latest
    env_file:
      - ./environments/common.env
      - ./environments/fire-backend.env
    ports:
      - "${BACKEND_PORT:-8181}:8181"
    restart: always
    depends_on:
      - mongo
      - rabbitmq-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host

  fire-configuration-service:
    build:
      context: fire-configurations
      dockerfile: Dockerfile
      network: host
    container_name: fire-configuration-service
    ports:
      - "${CONFIG_PORT:-31415}:31415"
    env_file:
      - ./environments/common.env
      - ./environments/fire-configuration.env
    environment:
      - MONGO_CONNECTION=mongodb://127.0.0.1:27017/configurations
    depends_on:
      - mongo
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:31415/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host

  fire-visualization-service:
    build:
      context: fire-visualization
      dockerfile: Dockerfile
      network: host
    container_name: fire-visualization-service
    ports:
      - "8080:8080"
    env_file:
      - ./environments/common.env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    network_mode: host

  postgres-sonar:
    image: postgres:15
    container_name: postgres-sonar
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
      PGPORT: 5555
    volumes:
      - sonar-postgres:/var/lib/postgresql/data
    ports:
      - "5555:5555"

  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    depends_on:
      - postgres-sonar
    restart: unless-stopped
    network_mode: host
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://127.0.0.1:5555/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"  
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
